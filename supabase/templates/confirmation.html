<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
      <tr>
        <td style="padding:32px;">
          <h1 style="margin:0 0 16px;font-size:20px;">Confirm your email</h1>
          <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#334155;">
            Thanks for signing up for Hostel ERP. Confirm your email address to finish creating your account and set up your hostel.
          </p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/onboarding"
               style="display:inline-block;padding:10px 18px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:bold;">
              Confirm email address
            </a>
          </p>
          <p style="margin:0;font-size:12px;line-height:1.6;color:#64748b;">
            This link expires in one hour. If you did not create an account, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
